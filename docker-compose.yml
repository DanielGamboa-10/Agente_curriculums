version: '3.8'

services:
  app:
    build: .
    container_name: talentai_cv_analyzer
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
    command: python -m streamlit run app/intermedio/cv_analyzer/app.py --server.address=0.0.0.0 --server.port=8501

